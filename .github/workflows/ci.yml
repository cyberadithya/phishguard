name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Style and type checks run before the suite so CI fails fast on cheap
      # problems instead of after a full test run.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Check docs are in sync with the rule engine
        run: npm run check:docs

      # Replaces the old bare `npm test` step: same suite, plus coverage
      # thresholds enforced. Running both would just run the suite twice.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build extension
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/manifest.json
          test -f dist/content/gmail.js
          test -f dist/background/service-worker.js
          test -f dist/popup/popup.js
